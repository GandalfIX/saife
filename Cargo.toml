[package]
name = "sandbox"
version = "0.3.0"
edition = "2024"
description = "Native Windows process sandbox for AI agents"
# The crate name stays `sandbox` (the binary is `saife`); these are the release
# metadata: MIT since 2026-10-25 (decision D1), the repo winget points at.
license = "MIT"
repository = "https://github.com/GandalfIX/saife"
homepage = "https://github.com/GandalfIX/saife"
authors = ["Gandalf IX <gandalfix@gandalfix.de>"]

[[bin]]
name = "saife"
path = "src/main.rs"

[[bin]]
name = "breakaway-helper"
path = "src/bin/breakaway-helper.rs"

# ADR-0004 / plan D1: the wrapper launcher that delivers NO_PROXY into the
# container (mxc-sdk 1.0.1 scrubs it from `request.environment`). Only needed by
# the MXC backend, so it is built only when that feature is on.
[[bin]]
name = "saife-launch"
path = "src/bin/saife-launch.rs"
required-features = ["mxc-backend"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Data_Xml_Dom",
    "UI_Notifications",
] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time", "sync"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
tokio-util = "0.7"
http = "1"
http-body-util = "0.1"
bytes = "1"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
# ADR-0004 Option A: the ProcessContainer containment backend. Optional and
# exact-pinned; the published crate is preferred over a git SHA, and every bump
# must re-run tests/vm/spikes/mxc-ga-spike.
mxc-sdk = { version = "=1.0.1", optional = true }

[features]
# ON BY DEFAULT (2026-10-22). The feature SELECTS the default backend: a build with
# it runs `mxc` unless --backend appcontainer is passed. It shipped opt-in while the
# migration was in progress, which meant the plain `cargo build --release` every
# reader runs produced an AppContainer-only binary - the default backend missing
# from the default build. Opt out explicitly with
#   cargo build --release --no-default-features
# which still builds a working AppContainer binary and says so at startup.
default = ["mxc-backend"]
mxc-backend = ["dep:mxc-sdk"]

[profile.release]
opt-level = 2
