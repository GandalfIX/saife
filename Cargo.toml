[package]
name = "sandbox"
version = "0.6.0"
edition = "2024"
# Edition 2024 needs 1.85; the let-chains in this crate need 1.88.
rust-version = "1.88"
description = "Native Windows process sandbox for AI agents"
# The crate name stays `sandbox` (the binary is `saife`); these are the release
# metadata: MIT since 2026-10-25 (decision D1), the repo winget points at.
license = "MIT"
repository = "https://github.com/GandalfIX/saife"
homepage = "https://github.com/GandalfIX/saife"
authors = ["Gandalf IX <gandalfix@gandalfix.de>"]

[[bin]]
name = "saife"
path = "src/main.rs"

[[bin]]
name = "breakaway-helper"
path = "src/bin/breakaway-helper.rs"

# ADR-0004 / plan D1: the wrapper launcher that delivers NO_PROXY into the
# container (mxc-sdk 1.0.1 scrubs it from `request.environment`). Only needed by
# the MXC backend, so it is built only when that feature is on.
[[bin]]
name = "saife-launch"
path = "src/bin/saife-launch.rs"
required-features = ["mxc-backend"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tar = "0.4"
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Data_Xml_Dom",
    "UI_Notifications",
] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time", "sync"] }
tokio-util = "0.7"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "zeroize"] }
sha2 = "0.10"
# L-L: used directly to wrap intermediate key bytes in `Zeroizing`. The
# ed25519-dalek `zeroize` feature (pinned above) keeps the crate's own
# ZeroizeOnDrop for the signing key. Note: in the currently resolved
# ed25519-dalek 2.2.0 the feature is also activated transitively
# (std -> alloc -> zeroize/alloc), but that is a resolution quirk, not a
# guarantee - the explicit feature line is the guard.
zeroize = "1"
subtle = "2"
base64 = "0.22"
# ADR-0004 Option A: the ProcessContainer containment backend. Optional and
# exact-pinned; the published crate is preferred over a git SHA, and every bump
# must re-run tests/vm/spikes/mxc-ga-spike.
mxc-sdk = { version = "=1.0.1", optional = true }

[build-dependencies]
# VERSIONINFO for the exes, derived from `[package] version` (R0.3). Build-time
# only: nothing links it, and a host without the Windows SDK degrades to a
# warning rather than a failed build.
winresource = "0.1"

# cargo-shear (packaging/check-devtools.ps1 installs it) is the unused-dependency
# gate. The tree carries zero `ignored` crate entries: every dependency declared
# here is imported. When the F-2 TLS/credential work (credential termination at
# the proxy - see the "MVP DEVIATION" note at the top of src/net/proxy.rs) needs
# the rustls/hyper/http chain again, redeclare it exactly when the first import
# lands.
[package.metadata.cargo-shear]
# The wbd-d03 SDK spike binary under tests/vm/spikes is a deliberately standalone
# throwaway; it is not linked into this crate.
ignored-paths = ["tests/vm/spikes/**"]


[features]
# ON BY DEFAULT (2026-10-22). The feature SELECTS the default backend: a build with
# it runs `mxc` unless --backend appcontainer is passed. It shipped opt-in while the
# migration was in progress, which meant the plain `cargo build --release` every
# reader runs produced an AppContainer-only binary - the default backend missing
# from the default build. Opt out explicitly with
#   cargo build --release --no-default-features
# which still builds a working AppContainer binary and says so at startup.
default = ["mxc-backend"]
mxc-backend = ["dep:mxc-sdk"]

[profile.release]
opt-level = 2
