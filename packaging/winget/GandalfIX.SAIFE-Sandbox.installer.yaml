# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
PackageIdentifier: GandalfIX.SAIFE-Sandbox
PackageVersion: 0.6.0
# The default backend needs the in-box base-container / PSEC support of Windows 11
# 24H2. The AppContainer backend also runs on older builds, but this package's
# default path does not, so the floor is stated instead of discovered at runtime.
MinimumOSVersion: 10.0.26100.0
InstallerType: zip
NestedInstallerType: portable
# One Installer entry per architecture. winget picks the entry that matches the host
# (ARM64 machines take the arm64 one and do not fall back to emulation), so both have
# to be present and each has to point at its own archive.
Installers:
  - Architecture: x64
    # Rewritten by packaging/release.ps1 from the built asset; the archive is FLAT
    # (no wrapper directory), which is what NestedInstallerFiles requires. Never edit
    # the URL or the hash by hand - a hand-edited hash is the known drift source.
    InstallerUrl: https://github.com/GandalfIX/saife/releases/download/v0.6.0/saife-0.6.0-x64.zip
    InstallerSha256: 9CE885FFE42ACEF53DFF676B415A173C0DDC678010FAF31A45AC699EB554BF45
    NestedInstallerType: portable
    NestedInstallerFiles:
      # The supervisor must find its launcher beside itself: both files are
      # extracted, but only the supervisor is aliased onto PATH.
      - RelativeFilePath: saife.exe
        PortableCommandAlias: saife
      - RelativeFilePath: saife-launch.exe
    Commands:
      - saife
  - Architecture: arm64
    # Placeholder hash: no arm64 archive has been published yet, so there is nothing
    # honest to put here. packaging/release.ps1 overwrites this line with the real
    # sha256 of saife-<version>-arm64.zip, and refusing the mismatch until then is
    # the correct behaviour - an install from this manifest before that step has to
    # fail rather than install unverified bytes.
    InstallerUrl: https://github.com/GandalfIX/saife/releases/download/v0.6.0/saife-0.6.0-arm64.zip
    InstallerSha256: 916E9CC279DA4C94F7A502C22355B593F21661E4B6E6BB41B433EC145490D52C
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: saife.exe
        PortableCommandAlias: saife
      - RelativeFilePath: saife-launch.exe
    Commands:
      - saife
ManifestType: installer
ManifestVersion: 1.12.0
