# cargo-about configuration for SAIFE Sandbox.
#
# THIRD-PARTY-LICENSES.md is a compliance artifact, not documentation. MIT,
# Apache-2.0, BSD, ISC, the Unlicense and Unicode-3.0 all require that the
# license text and the copyright notice are reproduced in every distribution of
# the binary, and Apache-2.0 (section 4d) also requires a crate's NOTICE file to
# travel with it. `cargo about generate` collects exactly that from the crates in
# Cargo.lock, so the file is regenerated by the build - never edited by hand.
#
# `accepted` is a priority list AND the gate: the build FAILS when a dependency
# carries a license that cannot be satisfied. For "MIT OR Apache-2.0" only the
# first matching text is collected, so the order below decides what the file
# shows. Adding an identifier is a deliberate act - read the license first. A
# copyleft license (GPL, AGPL, SSPL) must never be added just to make a build
# pass; it changes what the product may be distributed as.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-1-Clause",
    "ISC",
    "Unlicense",
    "Unicode-3.0",
]

# Only the two shipped targets are resolved. A crate that builds on unix only is
# never in either binary and must not be listed as if it were part of the product.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

# The workspace member is this product, not a third-party dependency.
# (Keys after a table header belong to that table, so this entry stays last.)
private = { ignore = true }

