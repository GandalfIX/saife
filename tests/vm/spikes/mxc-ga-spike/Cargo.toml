[package]
name = "mxc-ga-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Keep this crate out of any parent workspace.
[workspace]

[dependencies]
mxc-sdk = "=1.0.1"
serde_json = "1"
# TLS client for the workload that runs INSIDE the container (real HTTPS through
# the CONNECT tunnel). rustls + the OS root store: no Windows schannel
# revocation path, so an offline CRL endpoint cannot masquerade as a containment
# failure.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[[bin]]
name = "mxc-ga-spike"
path = "src/main.rs"

[[bin]]
name = "mxc-workload"
path = "src/bin/workload.rs"
